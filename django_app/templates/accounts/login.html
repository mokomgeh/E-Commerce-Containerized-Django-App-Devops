{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="col-md-6 mx-auto">
    <h1 class="h4 mb-4">Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="mt-3"><a href="{% url 'password_reset' %}">Forgot password?</a></p>
</div>
{% endblock %}

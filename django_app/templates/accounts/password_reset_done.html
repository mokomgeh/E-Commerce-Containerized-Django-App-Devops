{% extends "base.html" %}
{% block title %}Password Reset{% endblock %}
{% block content %}
<div class="col-md-6 mx-auto">
    <h1 class="h4 mb-4">Password Reset</h1>
    {% if form %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    {% else %}
    <p>Check the console (dev email backend) for your reset link, or check your inbox in production.</p>
    {% endif %}
</div>
{% endblock %}

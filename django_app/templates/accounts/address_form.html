{% extends "base.html" %}
{% block title %}Address{% endblock %}
{% block content %}
<div class="col-md-6 mx-auto">
    <h1 class="h4 mb-4">{% if address %}Edit{% else %}Add{% endif %} Address</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
{% endblock %}

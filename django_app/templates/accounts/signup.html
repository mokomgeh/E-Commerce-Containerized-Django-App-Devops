{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="col-md-6 mx-auto">
    <h1 class="h4 mb-4">Create an Account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>
</div>
{% endblock %}

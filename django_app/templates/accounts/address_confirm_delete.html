{% extends "base.html" %}
{% block title %}Delete Address{% endblock %}
{% block content %}
<div class="col-md-6 mx-auto">
    <h1 class="h4 mb-4">Delete this address?</h1>
    <p>{{ address.full_name }} — {{ address.address_line_1 }}, {{ address.city }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'accounts:address_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}

{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'catalog:home' %}">🛍️ Storefront</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                {% for department in departments_nav %}
                <li class="nav-item"><a class="nav-link" href="{{ department.get_absolute_url }}">{{ department.name }}</a></li>
                {% endfor %}
            </ul>
            <form class="d-flex me-3" role="search" action="{% url 'catalog:product_search' %}" method="get">
                <input class="form-control me-2" type="search" name="q" placeholder="Search products…" value="{{ request.GET.q }}">
                <button class="btn btn-outline-light" type="submit">Search</button>
            </form>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'cart:cart_detail' %}">
                        🛒 Cart <span class="badge bg-primary">{{ cart|length }}</span>
                    </a>
                </li>
                <li class="nav-item"><a class="nav-link" href="#">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Sign Up</a></li>
            </ul>
        </div>
    </div>
</nav>
